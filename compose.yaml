name: autolycus
services:
  monitor:
    image: ${AUTOLYCUS_IMAGE:-autolycus:local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-development}
    env_file:
      - .env
    environment:
      AUTOLYCUS_DATABASE: /var/lib/autolycus/autolycus.db
    volumes:
      - ./config.toml:/etc/autolycus/config.toml:ro
      - runtime:/var/lib/autolycus
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "autolycus.maintenance", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  runtime:
