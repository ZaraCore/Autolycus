# Confirmed from the supplied browser request and response.
# No credentials are stored in this file.
[site]
id = "test"
name = "Example service"
base_url = "https://backend.test"
metrics_path = "/api/metrics/query"
source = "platform_performance"
scope = "all-default-filters-custom-interval-v2"
timeout_seconds = 20

[query]
mode = "absolute"
start_parameter = "start"
end_parameter = "end"

[query.filters]
range = "custom"

[fields]
total = "data.total"
success = "data.success"
failure = "data.failure"
p50_seconds = "data.quantiles.p50"
p95_seconds = "data.quantiles.p95"
latency_samples = "data.duration_count"

[rules]
min_requests = 100
success_rate_min = 0.70
max_drop_points = 10.0
history_days = 7

[storage]
path = "test-data/history.db"

[notification]
enabled = true

[channel_monitor]
enabled = true
path = "/channel_monitor"

[model_performance]
enabled = true

[[model_performance.targets]]
group = "OpenAI"
model = "gpt-image-2"

[[model_performance.targets]]
group = "OpenAI"
model = "gpt-image-2.5-flare"

