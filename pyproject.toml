[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autolycus-monitor"
version = "0.2.0"
description = "New API hourly inspection and Feishu reports"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
autolycus = "autolycus.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
