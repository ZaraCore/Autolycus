name: checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: for script in scripts/linux/*.sh; do bash -n "$script"; done
      - run: cp .env.example .env && cp config/deployment.example.toml config.toml && docker compose config --quiet
      - run: docker build -f deploy/docker/Dockerfile -t autolycus:test .
      - run: docker run --rm autolycus:test python -m autolycus --help
      - name: Cron container integration (no network or real credentials)
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp --cap-drop ALL
          --security-opt no-new-privileges:true
          -v "$PWD/tests/cron_container_smoke.py:/smoke.py:ro"
          -v "$PWD/config/deployment.example.toml:/test-config.toml:ro"
          autolycus:test python /smoke.py
